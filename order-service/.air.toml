root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/main ./cmd/server"
bin = "./tmp/main"
entrypoint = ["./tmp/main"]
include_dir = ["../pkg"]
include_ext = ["go", "sql"]
exclude_dir = ["tmp", "vendor"]
exclude_regex = ["_test.go"]
delay = 1000
send_interrupt = true
kill_delay = "10s"
stop_on_error = true

[misc]
clean_on_exit = true
