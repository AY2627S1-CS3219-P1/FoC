# Local dev: one shared postgres server, one DB per service.
# Live reload via Air + bind mounts. Dev containers apply migrations on startup.
services:
  postgres:
    image: postgis/postgis:18-3.6
    container_name: foc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      USER_DB: ${USER_DB:-user_dev}
      SUPPLIER_DB: ${SUPPLIER_DB:-supplier_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foc}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile.dev
    container_name: foc-user-service
    ports:
      - "${USER_PORT:-8081}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${USER_DATABASE_URL:?set USER_DATABASE_URL in .env}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
    volumes:
      - ./user-service:/app
      - ./pkg:/pkg
      - /app/tmp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  supplier-service:
    build:
      context: .
      dockerfile: supplier-service/Dockerfile.dev
    container_name: foc-supplier-service
    ports:
      - "${SUPPLIER_PORT:-8082}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${SUPPLIER_DATABASE_URL:?set SUPPLIER_DATABASE_URL in .env}
      FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON:-}
    volumes:
      - ./supplier-service:/app
      - ./pkg:/pkg
      - /app/tmp
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
