# Local dev: one shared postgres server, one DB per service.
# Live reload via Air/Vite + bind mounts. Go containers apply migrations on startup.
services:
  frontend:
    image: node:24-bookworm-slim
    container_name: foc-frontend
    working_dir: /app
    command: sh -c "npm ci && exec npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    environment:
      # These URLs are used by the browser, outside the Compose network.
      PUBLIC_USER_SERVICE_URL: ${PUBLIC_USER_SERVICE_URL:-http://localhost:${USER_PORT:-8081}}
      PUBLIC_SUPPLIER_SERVICE_URL: ${PUBLIC_SUPPLIER_SERVICE_URL:-http://localhost:${SUPPLIER_PORT:-8082}}
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-svelte-kit:/app/.svelte-kit
    restart: unless-stopped

  postgres:
    image: postgis/postgis:18-3.6
    container_name: foc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-foc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      USER_DB: ${USER_DB:-user_dev}
      SUPPLIER_DB: ${SUPPLIER_DB:-supplier_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init-dbs.sh:/docker-entrypoint-initdb.d/init-dbs.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-foc}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.2.2
    container_name: foc-kafka
    ports:
      - "${KAFKA_PORT:-9092}:19092"
    environment:
      # Setting KAFKA_* variables replaces the image's default broker config.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Containers use kafka:9092; host clients use localhost:${KAFKA_PORT:-9092}.
      KAFKA_LISTENERS: PLAINTEXT://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LOG_DIRS: /var/lib/kafka/data/kraft-combined-logs
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.2.0
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    environment:
      KAFKA_BROKERS: kafka:9092
    volumes:
      - ./infra/kafka:/setup:ro
    entrypoint: ["/bin/sh", "/setup/kafka/create-topics.sh"]

  kafka-ui:
    container_name: foc-kafka-ui
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    ports:
      - "${KAFKA_UI_PORT:-8080}:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
    volumes:
      # Kafka UI creates dynamic_config.yaml here when settings are saved.
      - kafka-ui-config:/etc/kafkaui

  # Catches all outgoing mail. Read magic links at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31
    container_name: foc-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile.dev
    container_name: foc-user-service
    ports:
      - "${USER_PORT:-8081}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${USER_DATABASE_URL:?set USER_DATABASE_URL in .env}
      APP_ENV: ${APP_ENV:-local}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:${FRONTEND_PORT:-5173}}
      JWT_PRIVATE_KEY_FILE: ${JWT_PRIVATE_KEY_FILE:-/app/.local/secrets/auth/jwt-signing-private.pem}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL:-10m}
      JWT_REFRESH_TOKEN_TTL: ${JWT_REFRESH_TOKEN_TTL:-720h}
      BOOTSTRAP_SUPERADMIN_EMAIL: ${BOOTSTRAP_SUPERADMIN_EMAIL:-}
      BOOTSTRAP_SUPERADMIN_DISPLAY_NAME: ${BOOTSTRAP_SUPERADMIN_DISPLAY_NAME:-}
      SMTP_ADDR: ${SMTP_ADDR:-mailpit:1025}
      SMTP_FROM: ${SMTP_FROM:-FoC <no-reply@foc.local>}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - ./user-service:/app
      - ./pkg:/pkg
      - ./.local/secrets/auth:/app/.local/secrets/auth
      - go-modules:/go/pkg/mod
      - /app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  supplier-service:
    build:
      context: .
      dockerfile: supplier-service/Dockerfile.dev
    container_name: foc-supplier-service
    ports:
      - "${SUPPLIER_PORT:-8082}:8080"
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: ${SUPPLIER_DATABASE_URL:?set SUPPLIER_DATABASE_URL in .env}
      USER_SERVICE_BASE_URL: ${USER_SERVICE_BASE_URL:-http://user-service:8080}
    volumes:
      - ./supplier-service:/app
      - ./pkg:/pkg
      # Supplier Service imports the auth middleware from user-service/pkg.
      - ./user-service:/user-service
      - go-modules:/go/pkg/mod
      - /app/tmp
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  kafka-ui-config:
  frontend-node-modules:
  frontend-svelte-kit:
  go-modules:
