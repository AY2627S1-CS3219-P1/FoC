name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go-tests:
    name: Go tests (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [pkg, user-service, supplier-service]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: Run all Go tests
        run: go test ./...

  supplier-integration:
    name: Supplier database integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: supplier-service
    env:
      GOWORK: 'off'
      GOFLAGS: '-mod=readonly'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Skip documentation-only changes
        id: changes
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          paths=$(git diff --name-only "$BASE_SHA" HEAD)
          while IFS= read -r path; do
            case "$path" in
              ''|docs/*|*.md|*.mdx|LICENSE|LICENSE.*) ;;
              *) echo 'run=true' >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
          done <<< "$paths"
          echo 'run=false' >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v7
        if: steps.changes.outputs.run == 'true'
        with:
          go-version-file: supplier-service/go.mod
          cache-dependency-path: |
            supplier-service/go.sum
            pkg/go.sum
      - name: Run Supplier database integration tests
        if: steps.changes.outputs.run == 'true'
        run: make test-integration

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: pkg/go.mod
      - run: npm ci
      - run: make buf-lint
        working-directory: .
      - run: make buf-generate
        working-directory: .
      - run: git diff --exit-code -- pkg/gen frontend/src/lib/gen
        working-directory: .
      - run: test -z "$(git ls-files --others --exclude-standard -- pkg/gen frontend/src/lib/gen)"
        working-directory: .
      - run: npm run check
      - run: npm test
      - run: npm run build
