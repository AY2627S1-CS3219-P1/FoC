# Existing platform resources stay administrator-owned. Releases may reconcile
# only their named StorageClass/gateway binding, never namespaces, CRDs, admission
# policies, RBAC, cluster Secrets, or unrelated infrastructure.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: foc-release-platform
rules:
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    resourceNames: [gateways.gateway.networking.k8s.io, gatewayclasses.gateway.networking.k8s.io, httproutes.gateway.networking.k8s.io, targetgroupbindings.elbv2.k8s.aws]
    verbs: [get]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gatewayclasses]
    resourceNames: [istio]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    resourceNames: [foc-gp3]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: foc-release-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: foc-release-platform
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: foc-release
---
# Helm stores its dynamic release history in Secrets in this namespace. This is
# trusted workload deployment access, including Grafana's existing admin Secret.
# Alloy's log-reading Roles/Bindings remain administrator-owned.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foc-release
  namespace: foc-observability
rules:
  - apiGroups: ['']
    resources: [configmaps, services, serviceaccounts, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ['']
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  # The platform administrator creates this cross-namespace grant first.
  - apiGroups: [gateway.networking.k8s.io]
    resources: [referencegrants]
    resourceNames: [grafana-from-app-route]
    verbs: [get, update, patch]
  - apiGroups: [security.istio.io]
    resources: [authorizationpolicies, peerauthentications]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: foc-release
  namespace: foc-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: foc-release
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: foc-release
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foc-release
  namespace: foc
rules:
  - apiGroups: ['']
    resources: [configmaps, services, serviceaccounts]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [user-db, supplier-db, order-db, credit-db, communication-db, content-moderation-db, moderation-db, moderation-llm, jwt-signing, kafka-ui-auth, telegram, smtp]
    verbs: [get]
  - apiGroups: ['']
    resources: [pods, events]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [httproutes]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [security.istio.io]
    resources: [authorizationpolicies, peerauthentications]
    verbs: [get, list, watch, create, update, patch]
  - apiGroups: [networking.istio.io]
    resources: [sidecars]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: foc-release
  namespace: foc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: foc-release
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: foc-release
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: foc-release
  namespace: istio-ingress
rules:
  - apiGroups: ['']
    resources: [configmaps]
    resourceNames: [foc-public-infrastructure]
    verbs: [get, update, patch]
  - apiGroups: [gateway.networking.k8s.io]
    resources: [gateways]
    resourceNames: [foc-public]
    verbs: [get, list, watch, update, patch]
  - apiGroups: [elbv2.k8s.aws]
    resources: [targetgroupbindings]
    resourceNames: [foc-public]
    verbs: [get, update, patch]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [foc-public-istio]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: foc-release
  namespace: istio-ingress
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: foc-release
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: foc-release
