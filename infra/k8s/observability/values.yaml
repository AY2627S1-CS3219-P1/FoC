deploymentMode: Monolithic
loki:
  image:
    tag: 3.7.9
    digest: sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
  auth_enabled: false
  podAnnotations:
    sidecar.istio.io/nativeSidecar: "true"
  containerSecurityContext:
    runAsNonRoot: true
    runAsUser: 10001
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: [ALL]
  commonConfig:
    replication_factor: 1
    path_prefix: /var/loki
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  storage:
    type: s3
    use_thanos_objstore: false
    bucketNames:
      chunks: REPLACE_ME
      ruler: REPLACE_ME
      admin: REPLACE_ME
  storage_config:
    tsdb_shipper:
      active_index_directory: /var/loki/tsdb-index
      cache_location: /var/loki/tsdb-cache
  ingester:
    wal:
      enabled: true
      dir: /var/loki/wal
    chunk_idle_period: 5m
    max_chunk_age: 1h
  limits_config:
    retention_period: 168h
    allow_structured_metadata: true
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    delete_request_store: s3
  pattern_ingester:
    enabled: false
singleBinary:
  replicas: 1
  sidecar: false
  initContainers: []
  persistence:
    enabled: true
    size: 5Gi
    enableStatefulSetAutoDeletePVC: true
    whenDeleted: Retain
    whenScaled: Retain
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
read: {enabled: false, replicas: 0}
write: {enabled: false, replicas: 0}
backend: {enabled: false, replicas: 0}
gateway: {enabled: false}
lokiCanary: {enabled: false}
test: {enabled: false}
chunksCache: {enabled: false}
resultsCache: {enabled: false}
ruler: {enabled: false}
patternIngester: {enabled: false}
rollout_operator: {enabled: false}
serviceAccount:
  create: true
  name: loki
sidecar:
  rules:
    enabled: false
memcached: {enabled: false}
memcachedExporter: {enabled: false}
# No rule-loader requires Kubernetes API permissions.
rbac:
  namespaced: true
