apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: admin-uis
spec:
  parentRefs:
    - name: foc-public
      namespace: istio-ingress
      sectionName: https
  rules:
    - matches:
        - path: {type: Exact, value: /grafana}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            path: {type: ReplaceFullPath, replaceFullPath: /grafana/}
            statusCode: 301
    - matches:
        - path: {type: PathPrefix, value: /grafana/}
      backendRefs:
        - name: grafana
          namespace: foc-observability
          port: 3000
    - matches:
        - path: {type: Exact, value: /kafka}
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            port: 443
            path: {type: ReplaceFullPath, replaceFullPath: /kafka/}
            statusCode: 301
    - matches:
        - path: {type: PathPrefix, value: /kafka/}
      backendRefs:
        - name: kafka-ui
          port: 8080
