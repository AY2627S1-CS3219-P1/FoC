---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: foc
  name: moderation-service
spec:
  parentRefs:
    - name: foc-public
      namespace: istio-ingress
      sectionName: https
  rules:
    - matches:
        - path: {type: PathPrefix, value: /moderation.v1.HealthService}
        - path: {type: PathPrefix, value: /moderation.report.v1.ReportService}
        - path: {type: PathPrefix, value: /moderation.appeal.v1.AppealService}
      backendRefs:
        - name: moderation-service-external
          port: 8080
