apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/applications
patches:
  - target:
      kind: Deployment
      name: order-service
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          secretRef:
            name: object-storage
  - target:
      kind: VirtualService
      name: foc
    patch: |-
      - op: add
        path: /spec/http/0
        value:
          match:
            - uri:
                prefix: /order-images/
          route:
            - destination:
                host: floci.foc.svc.cluster.local
                port:
                  number: 4566
