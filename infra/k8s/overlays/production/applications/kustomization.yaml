apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/applications
patches:
  - target:
      kind: Gateway
      name: foc
    patch: |-
      - op: replace
        path: /spec/servers/0/hosts/0
        value: foc.example.invalid
      - op: replace
        path: /spec/servers/0/tls/credentialName
        value: foc-public-tls
  - target:
      kind: VirtualService
      name: foc
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: foc.example.invalid
