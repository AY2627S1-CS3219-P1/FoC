apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/dependencies
patches:
  - target:
      kind: ConfigMap
      name: foc-config
    patch: |-
      - op: replace
        path: /data/FRONTEND_BASE_URL
        value: https://foc.example.invalid
      - op: replace
        path: /data/ORIGIN
        value: https://foc.example.invalid
      - op: replace
        path: /data/PUBLIC_USER_SERVICE_URL
        value: https://foc.example.invalid
      - op: replace
        path: /data/PUBLIC_SUPPLIER_SERVICE_URL
        value: https://foc.example.invalid
