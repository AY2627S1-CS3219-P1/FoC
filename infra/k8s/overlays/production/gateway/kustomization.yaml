apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/gateway
patches:
  - target:
      kind: Gateway
      name: foc-public
    patch: |-
      - op: add
        path: /spec/listeners/0/hostname
        value: foc.example.invalid
      - op: replace
        path: /spec/listeners/0/tls/certificateRefs/0/name
        value: foc-public-tls
  - target:
      kind: HTTPRoute
    patch: |-
      - op: add
        path: /spec/hostnames
        value: [foc.example.invalid]
