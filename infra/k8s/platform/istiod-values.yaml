pilot:
  env:
    ENABLE_NATIVE_SIDECARS: "true"
global:
  proxy:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        memory: 256Mi
    startupProbe:
      enabled: true
      failureThreshold: 60
meshConfig:
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
  # Presigned object URLs and login links contain credentials in their queries.
  accessLogFormat: |
    {"start_time":"%START_TIME%","method":"%REQ(:METHOD)%","path":"%PATH(NQ:PATH)%","protocol":"%PROTOCOL%","response_code":"%RESPONSE_CODE%","response_flags":"%RESPONSE_FLAGS%","duration":"%DURATION%","request_id":"%REQ(X-REQUEST-ID)%","upstream_cluster":"%UPSTREAM_CLUSTER%","upstream_host":"%UPSTREAM_HOST%","downstream_peer_uri_san":"%DOWNSTREAM_PEER_URI_SAN%"}
  defaultConfig:
    terminationDrainDuration: 5s
