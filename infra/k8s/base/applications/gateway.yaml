apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: communication-service
spec:
  parentRefs:
    - name: foc-public
      namespace: istio-ingress
      sectionName: https
  rules:
    - matches:
        - path: {type: PathPrefix, value: /communication.v1.RealtimeService}
      timeouts:
        request: 0s
        backendRequest: 0s
      backendRefs:
        - name: communication-service-external
          port: 8080
    - matches:
        - path: {type: PathPrefix, value: /communication.v1.HealthService}
        - path: {type: PathPrefix, value: /communication.v1.TelegramLinkService}
      backendRefs:
        - name: communication-service-external
          port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
