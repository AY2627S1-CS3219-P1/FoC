apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: user-service
spec:
  parentRefs:
    - name: foc-public
      namespace: istio-ingress
      sectionName: https
  rules:
    - matches:
        - path: {type: PathPrefix, value: /user.v1.AuthService}
        - path: {type: PathPrefix, value: /user.v1.HealthService}
        - path: {type: PathPrefix, value: /user.v1.ProfileService}
        - path: {type: PathPrefix, value: /user.v1.UserAdminService}
        - path: {type: PathPrefix, value: /user.v1.AllowedDomainAdminService}
        - path: {type: PathPrefix, value: /user.review.v1.ReviewService}
        - path: {type: PathPrefix, value: /user.warning.v1.WarningService}
        - path: {type: PathPrefix, value: /user.warning.v1.WarningAdminService}
        - path: {type: PathPrefix, value: /user.report.v1.ReportService}
        - path: {type: PathPrefix, value: /user.appeal.v1.AppealService}
      backendRefs:
        - name: user-service-external
          port: 8080
---
