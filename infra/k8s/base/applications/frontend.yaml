apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector:
    app: frontend
  ports:
    - {name: http-web, port: 3000, targetPort: 3000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    foc.dev/stage: applications
spec:
  replicas: 1
  progressDeadlineSeconds: 180
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      serviceAccountName: frontend
      containers:
        - name: frontend
          image: foc/frontend:local
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - configMapRef:
                name: foc-config
          env:
            - {name: HOST, value: "127.0.0.1"}
            - {name: PORT, value: "3000"}
          ports:
            - containerPort: 3000
          readinessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
---
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: frontend
spec:
  workloadSelector:
    labels:
      app: frontend
  ingress:
    - port:
        number: 3000
        name: http-web
        protocol: HTTP
      defaultEndpoint: 127.0.0.1:3000
  egress:
    - hosts: ["./*", "istio-system/*"]
