apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: floci-images
spec:
  parentRefs:
    - name: foc-public
      namespace: istio-ingress
      sectionName: https
  rules:
    - matches:
        - path: {type: PathPrefix, value: /order-images/}
          method: GET
        - path: {type: PathPrefix, value: /order-images/}
          method: HEAD
        - path: {type: PathPrefix, value: /order-images/}
          method: PUT
        - path: {type: PathPrefix, value: /order-images/}
          method: OPTIONS
      backendRefs:
        - name: floci
          port: 4566
    - matches:
        - path: {type: PathPrefix, value: /user-images/}
          method: GET
        - path: {type: PathPrefix, value: /user-images/}
          method: HEAD
        - path: {type: PathPrefix, value: /user-images/}
          method: PUT
        - path: {type: PathPrefix, value: /user-images/}
          method: OPTIONS
      backendRefs:
        - name: floci
          port: 4566
    - matches:
        - path: {type: PathPrefix, value: /moderation-images/}
          method: GET
        - path: {type: PathPrefix, value: /moderation-images/}
          method: HEAD
        - path: {type: PathPrefix, value: /moderation-images/}
          method: PUT
        - path: {type: PathPrefix, value: /moderation-images/}
          method: OPTIONS
      backendRefs:
        - name: floci
          port: 4566
