apiVersion: batch/v1
kind: Job
metadata:
  name: db-provision
  labels:
    foc.dev/stage: provisioning
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: db-provision
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      serviceAccountName: db-provision
      restartPolicy: Never
      containers:
        - name: db-provision
          image: nickblah/postgis:18.6-trixie-postgis-3.6.4@sha256:48edec2374758f62a5336ee0279aeca0107c1c63536f0a0872bee2a7b3126237
          command: ["/bin/sh", "/setup/provision.sh"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: postgres-admin
          volumeMounts:
            - {name: script, mountPath: /setup, readOnly: true}
            - {name: user, mountPath: /secrets/user, readOnly: true}
            - {name: supplier, mountPath: /secrets/supplier, readOnly: true}
            - {name: order, mountPath: /secrets/order, readOnly: true}
            - {name: communication, mountPath: /secrets/communication, readOnly: true}
      volumes:
        - name: script
          configMap:
            name: db-provision-script
        - name: user
          secret:
            secretName: user-db
        - name: supplier
          secret:
            secretName: supplier-db
        - name: order
          secret:
            secretName: order-db

        - name: communication
          secret:
            secretName: communication-db
