apiVersion: batch/v1
kind: Job
metadata:
  name: user-migrate
  labels:
    foc.dev/stage: initialization
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: user-migrate
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      serviceAccountName: user-migrate
      restartPolicy: Never
      containers:
        - name: user-migrate
          image: foc/migrations:local
          imagePullPolicy: IfNotPresent
          args: ["-dir", "/migrations/user", "up"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - name: GOOSE_DRIVER
              value: postgres
            - name: GOOSE_DBSTRING
              valueFrom:
                secretKeyRef:
                  name: user-db
                  key: DATABASE_URL
