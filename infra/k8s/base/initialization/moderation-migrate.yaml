apiVersion: batch/v1
kind: Job
metadata:
  name: moderation-migrate
  labels:
    foc.dev/stage: initialization
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: moderation-migrate
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      serviceAccountName: moderation-migrate
      restartPolicy: Never
      containers:
        - name: moderation-migrate
          image: foc/migrations:local
          imagePullPolicy: IfNotPresent
          args: ["-dir", "/migrations/moderation", "postgres", "$(DATABASE_URL)", "up"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: moderation-db
