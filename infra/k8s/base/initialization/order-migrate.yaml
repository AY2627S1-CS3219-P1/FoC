apiVersion: batch/v1
kind: Job
metadata:
  name: order-migrate
  labels:
    foc.dev/stage: initialization
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: order-migrate
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      serviceAccountName: order-migrate
      restartPolicy: Never
      containers:
        - name: order-migrate
          image: foc/order-service:local
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: order-db
