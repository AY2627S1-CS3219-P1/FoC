apiVersion: batch/v1
kind: Job
metadata:
  name: credit-migrate
  labels:
    foc.dev/stage: initialization
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app: credit-migrate
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      serviceAccountName: credit-migrate
      restartPolicy: Never
      containers:
        - name: credit-migrate
          image: foc/migrations:local
          imagePullPolicy: IfNotPresent
          args: ["-dir", "/migrations/credit", "postgres", "$(DATABASE_URL)", "up"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: credit-db
