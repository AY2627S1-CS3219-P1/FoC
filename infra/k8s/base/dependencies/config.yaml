apiVersion: v1
kind: ConfigMap
metadata:
  name: foc-config
  labels:
    foc.dev/stage: dependencies
data:
  APP_ENV: production
  RPC_MODE: mesh
  PORT: "8080"
  RUN_MIGRATIONS: "false"
  FRONTEND_BASE_URL: https://localhost:8443
  ORIGIN: https://localhost:8443
  PUBLIC_USER_SERVICE_URL: https://localhost:8443
  PUBLIC_SUPPLIER_SERVICE_URL: https://localhost:8443
  USER_SERVICE_BASE_URL: http://user-service-internal:8080
  JWT_PRIVATE_KEY_FILE: /var/run/foc/auth/jwt-signing-private.pem
  BOOTSTRAP_SUPERADMIN_EMAIL: ""
  BOOTSTRAP_SUPERADMIN_DISPLAY_NAME: Admin
