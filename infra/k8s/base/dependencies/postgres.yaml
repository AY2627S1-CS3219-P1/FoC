apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector:
    app: postgres
  ports:
    - name: tcp-postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    foc.dev/stage: dependencies
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      serviceAccountName: postgres
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: nickblah/postgis:18.6-trixie-postgis-3.6.4@sha256:48edec2374758f62a5336ee0279aeca0107c1c63536f0a0872bee2a7b3126237
          args: ["postgres", "-c", "listen_addresses=127.0.0.1"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          envFrom:
            - secretRef:
                name: postgres-admin
          env:
            - name: PGDATA
              value: /var/lib/postgresql/18/docker
          ports:
            - containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1"]
            failureThreshold: 60
            periodSeconds: 2
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1"]
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes: []
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: postgres
spec:
  workloadSelector:
    labels:
      app: postgres
  ingress:
    - port:
        number: 5432
        name: tcp-postgres
        protocol: TCP
      defaultEndpoint: 127.0.0.1:5432
  egress:
    - hosts: ["./*", "istio-system/*"]
