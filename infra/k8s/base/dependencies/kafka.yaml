apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  # Kafka's AdminClient follows advertised listeners even when bootstrapping
  # over loopback. It must resolve/reach this broker before readiness succeeds.
  publishNotReadyAddresses: true
  selector:
    app: kafka
  ports:
    - name: tcp-kafka
      port: 9092
      targetPort: 9092
    - name: tcp-controller
      port: 9093
      targetPort: 9093
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    foc.dev/stage: dependencies
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        sidecar.istio.io/nativeSidecar: "true"
    spec:
      serviceAccountName: kafka
      securityContext:
        fsGroup: 1000
      terminationGracePeriodSeconds: 30
      containers:
        - name: kafka
          image: apache/kafka:4.2.2@sha256:1213eb3943d551e5ed1fca7a4e109001cee35770b66a02a0c37a8964efe09b69
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          env:
            - {name: CLUSTER_ID, value: MkU3OEVBNTcwNTJENDM2Qk}
            - {name: KAFKA_NODE_ID, value: "1"}
            - {name: KAFKA_PROCESS_ROLES, value: "broker,controller"}
            - {name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@127.0.0.1:9093"}
            - {name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER}
            - {name: KAFKA_LISTENERS, value: "PLAINTEXT://127.0.0.1:9092,CONTROLLER://127.0.0.1:9093"}
            - {name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka.foc.svc.cluster.local:9092"}
            - {name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"}
            - {name: KAFKA_INTER_BROKER_LISTENER_NAME, value: PLAINTEXT}
            - {name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false"}
            - {name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/kraft-combined-logs}
            - {name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1"}
            - {name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1"}
            - {name: KAFKA_HEAP_OPTS, value: "-Xms256m -Xmx512m"}
          ports:
            - containerPort: 9092
            - containerPort: 9093
          startupProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
            failureThreshold: 40
            periodSeconds: 5
            timeoutSeconds: 10
          readinessProbe:
            exec:
              command: ["/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "127.0.0.1:9092", "--list"]
            periodSeconds: 15
            timeoutSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - {name: data, mountPath: /var/lib/kafka/data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
---
apiVersion: networking.istio.io/v1
kind: Sidecar
metadata:
  name: kafka
spec:
  workloadSelector:
    labels:
      app: kafka
  ingress:
    - port:
        number: 9092
        name: tcp-kafka
        protocol: TCP
      defaultEndpoint: 127.0.0.1:9092
    - port:
        number: 9093
        name: tcp-controller
        protocol: TCP
      defaultEndpoint: 127.0.0.1:9093
  egress:
    - hosts: ["./*", "istio-system/*"]
