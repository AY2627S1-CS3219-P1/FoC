apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: strict
spec:
  mtls:
    mode: STRICT
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
spec: {}
---
# Authentication first: authenticated workloads in this app namespace may
# communicate. Fine-grained per-service permissions are deliberately deferred.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: authenticated-app-workloads
spec:
  action: ALLOW
  rules:
    - from:
        - source:
            namespaces: [foc]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-public-rpc
spec:
  selector:
    matchLabels:
      foc.dev/rpc: "true"
  action: ALLOW
  rules:
    - from:
        - source:
            principals: [cluster.local/ns/istio-ingress/sa/foc-public]
      to:
        - operation:
            ports: ["8080"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-never-internal
spec:
  action: DENY
  rules:
    - from:
        - source:
            principals: [cluster.local/ns/istio-ingress/sa/foc-public]
      to:
        - operation:
            ports: ["8081"]
---
# Credit's reservation methods do not authenticate application callers.
# Keep their internal listener reachable only by Order's workload identity.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: credit-internal-order-only
spec:
  selector:
    matchLabels:
      app: credit-service
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals: [cluster.local/ns/foc/sa/order-service]
      to:
        - operation:
            ports: ["8081"]
---
# Communication's internal listener sends email, so only User Service, which
# sends magic links, may reach it.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: communication-internal-user-only
spec:
  selector:
    matchLabels:
      app: communication-service
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals: [cluster.local/ns/foc/sa/user-service]
      to:
        - operation:
            ports: ["8081"]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: gateway-frontend
spec:
  selector:
    matchLabels:
      app: frontend
  rules:
    - from:
        - source:
            principals: [cluster.local/ns/istio-ingress/sa/foc-public]
      to:
        - operation:
            ports: ["3000"]
---
# Suspension decisions are User-owned. DENY overrides the namespace-wide ALLOW,
# including for authenticated FoC workloads other than User Service. A user JWT
# or identity header cannot substitute for the mTLS workload principal.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: order-suspension-user-only
spec:
  selector:
    matchLabels:
      app: order-service
  action: DENY
  rules:
    - from:
        - source:
            notPrincipals: [cluster.local/ns/foc/sa/user-service]
      to:
        - operation:
            ports: ["8081"]
            paths: ["/order.v1.OrderInternalService/ApplyAccountSuspension"]
