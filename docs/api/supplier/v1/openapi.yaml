openapi: 3.1.0
info:
  title: API
  description: API documentation for API
  version: 1.0.0
paths: {}
components:
  schemas:
    google.protobuf.FieldMask:
      type: string
      description: Comma-separated field paths in lowerCamelCase (for example, `user.displayName,photo`).
    google.protobuf.Timestamp:
      type: string
      examples:
        - "2023-01-15T01:30:15.01Z"
        - "2024-12-25T12:00:00Z"
      format: date-time
      description: A point in time in RFC 3339 format, with up to nanosecond precision. Output uses UTC (`Z`); input may use an offset from UTC.
    google.type.TimeOfDay:
      type: object
      properties:
        hours:
          type: integer
          title: hours
          format: int32
          description: |-
            Hours of a day in 24 hour format. Must be greater than or equal to 0 and
             typically must be less than or equal to 23. An API may choose to allow the
             value "24:00:00" for scenarios like business closing time.
        minutes:
          type: integer
          title: minutes
          format: int32
          description: |-
            Minutes of an hour. Must be greater than or equal to 0 and less than or
             equal to 59.
        seconds:
          type: integer
          title: seconds
          format: int32
          description: |-
            Seconds of a minute. Must be greater than or equal to 0 and typically must
             be less than or equal to 59. An API may allow the value 60 if it allows
             leap-seconds.
        nanos:
          type: integer
          title: nanos
          format: int32
          description: |-
            Fractions of seconds, in nanoseconds. Must be greater than or equal to 0
             and less than or equal to 999,999,999.
      title: TimeOfDay
      additionalProperties: false
      description: |-
        Represents a time of day. The date and time zone are either not significant
         or are specified elsewhere. An API may choose to allow leap seconds. Related
         types are [google.type.Date][google.type.Date] and
         `google.protobuf.Timestamp`.
    supplier.v1.ApproveLocationAdditionRequestRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: Existing request identity.
      title: ApproveLocationAdditionRequestRequest
      additionalProperties: false
      description: Approve one caller-visible request.
    supplier.v1.ApproveLocationAdditionRequestResponse:
      type: object
      properties:
        request:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.LocationAdditionRequest'
          title: request
          description: Full for submitters/admins; approved public views redact identities and notes.
        location:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.Location'
          title: location
          description: Location created atomically with approval, or the original on retry.
      title: ApproveLocationAdditionRequestResponse
      additionalProperties: false
      description: Resulting caller-projected request.
    supplier.v1.Building:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Stable Building identity.
        name:
          type: string
          title: name
          description: Display name.
        center:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.Coordinates'
          title: center
          description: Coverage center.
        radiusM:
          type: number
          title: radius_m
          format: float
          description: Coverage radius in meters.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
          description: Creation time in UTC.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
          description: Last modification in UTC.
      title: Building
      additionalProperties: false
      description: Seed-managed campus Building.
    supplier.v1.CancelDisablementRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: Existing Disablement identity.
      title: CancelDisablementRequest
      additionalProperties: false
      description: Idempotent terminal command. A different terminal state is rejected.
    supplier.v1.CancelDisablementResponse:
      type: object
      properties:
        disablement:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.Disablement'
          title: disablement
          description: Current persisted interval and lifecycle state.
      title: CancelDisablementResponse
      additionalProperties: false
      description: Resulting Disablement.
    supplier.v1.Category:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Stable Category identity.
        name:
          type: string
          title: name
          description: Display name.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
          description: Creation time in UTC.
      title: Category
      additionalProperties: false
      description: Seed-managed classification of a Supplier Location.
    supplier.v1.CheckRequest:
      type: object
      title: CheckRequest
      additionalProperties: false
    supplier.v1.CheckResponse:
      type: object
      properties:
        status:
          type: string
          title: status
      title: CheckResponse
      additionalProperties: false
    supplier.v1.Coordinates:
      type: object
      properties:
        latitude:
          type: number
          title: latitude
          maximum: 90
          minimum: -90
          format: double
          description: Latitude north of the equator.
        longitude:
          type: number
          title: longitude
          maximum: 180
          minimum: -180
          format: double
          description: Longitude east of Greenwich.
      title: Coordinates
      additionalProperties: false
      description: WGS84 coordinates, in degrees.
    supplier.v1.CreateDisablementRequest:
      type: object
      properties:
        locationId:
          type: string
          title: location_id
          format: uuid
          description: Existing unarchived Location.
        startsAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: starts_at
          description: Omitted means now.
        endsAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ends_at
          description: Omitted means indefinite; otherwise later than start.
        reason:
          type: string
          title: reason
          maxLength: 500
          minLength: 1
          description: Trimmed reason, 1-500 characters.
        idempotencyKey:
          type: string
          title: idempotency_key
          format: uuid
          description: UUID retry key scoped by caller and method for 24 hours.
      title: CreateDisablementRequest
      additionalProperties: false
      description: Creates a non-overlapping interval on an unarchived Location.
    supplier.v1.CreateDisablementResponse:
      type: object
      properties:
        disablement:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.Disablement'
          title: disablement
          description: Current persisted interval and lifecycle state.
      title: CreateDisablementResponse
      additionalProperties: false
      description: Resulting Disablement.
    supplier.v1.Disablement:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Stable Disablement identity.
        locationId:
          type: string
          title: location_id
          description: Location receiving the warning.
        startsAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: starts_at
          description: Absolute start, normalized to UTC.
        endsAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ends_at
          description: Natural end, absent for indefinite intervals.
        endedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ended_at
          description: Explicit early end, if any.
        cancelledAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: cancelled_at
          description: Cancellation before start, if any.
        reason:
          type: string
          title: reason
          description: Trimmed operational reason.
        createdBy:
          type: string
          title: created_by
          description: Administrator who created the interval.
        state:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.DisablementState'
          title: state
          description: Lifecycle state at response time.
        revision:
          type: string
          title: revision
          format: int64
          description: Optimistic concurrency revision.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
          description: Creation time in UTC.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
          description: Modification time in UTC.
      title: Disablement
      additionalProperties: false
      description: Temporary operational warning for one Location.
    supplier.v1.DisablementState:
      type: string
      title: DisablementState
      enum:
        - DISABLEMENT_STATE_UNSPECIFIED
        - DISABLEMENT_STATE_SCHEDULED
        - DISABLEMENT_STATE_ACTIVE
        - DISABLEMENT_STATE_ENDED
        - DISABLEMENT_STATE_CANCELLED
      description: Lifecycle state derived from the interval and terminal timestamps.
    supplier.v1.EndDisablementRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: Existing Disablement identity.
      title: EndDisablementRequest
      additionalProperties: false
      description: Idempotent terminal command. A different terminal state is rejected.
    supplier.v1.EndDisablementResponse:
      type: object
      properties:
        disablement:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.Disablement'
          title: disablement
          description: Current persisted interval and lifecycle state.
      title: EndDisablementResponse
      additionalProperties: false
      description: Resulting Disablement.
    supplier.v1.GetLocationAdditionRequestRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: Existing request identity.
      title: GetLocationAdditionRequestRequest
      additionalProperties: false
      description: Get one caller-visible request.
    supplier.v1.GetLocationAdditionRequestResponse:
      type: object
      properties:
        request:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.LocationAdditionRequest'
          title: request
          description: Full for submitters/admins; approved public views redact identities and notes.
      title: GetLocationAdditionRequestResponse
      additionalProperties: false
      description: Resulting caller-projected request.
    supplier.v1.ListDisablementsRequest:
      type: object
      properties:
        locationId:
          type: string
          title: location_id
          format: uuid
          description: Existing Location.
        state:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.DisablementState'
          title: state
          description: |
            Unspecified includes all states.
            enum.defined_only = true
        page:
          type: integer
          title: page
          minimum: 0
          format: int32
          description: One-based; zero means 1.
        pageSize:
          type: integer
          title: page_size
          maximum: 100
          minimum: 0
          format: int32
          description: Zero means 20; maximum 100.
      title: ListDisablementsRequest
      additionalProperties: false
      description: Lists one Location's intervals, ordered by start descending then ID.
    supplier.v1.ListDisablementsResponse:
      type: object
      properties:
        disablements:
          type: array
          items:
            $ref: '#/components/schemas/supplier.v1.Disablement'
          title: disablements
          description: Intervals in stable order.
        pageInfo:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.PageInfo'
          title: page_info
          description: Pagination metadata.
      title: ListDisablementsResponse
      additionalProperties: false
      description: Matching intervals and caller-visible counts.
    supplier.v1.ListLocationAdditionRequestsRequest:
      type: object
      properties:
        status:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.LocationAdditionRequestStatus'
          title: status
          description: |
            Unspecified includes all visible states.
            enum.defined_only = true
        page:
          type: integer
          title: page
          minimum: 0
          format: int32
          description: One-based; zero means 1.
        pageSize:
          type: integer
          title: page_size
          maximum: 100
          minimum: 0
          format: int32
          description: Zero means 20; maximum 100.
      title: ListLocationAdditionRequestsRequest
      additionalProperties: false
      description: Counts and filters apply after caller visibility.
    supplier.v1.ListLocationAdditionRequestsResponse:
      type: object
      properties:
        requests:
          type: array
          items:
            $ref: '#/components/schemas/supplier.v1.LocationAdditionRequest'
          title: requests
          description: Caller-projected resources.
        pageInfo:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.PageInfo'
          title: page_info
          description: Counts include only visible matching rows.
      title: ListLocationAdditionRequestsResponse
      additionalProperties: false
      description: Visible requests ordered by creation descending then ID.
    supplier.v1.Location:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Stable identity shared by ordinary and Supplier Locations.
        name:
          type: string
          title: name
          description: Non-unique display name.
        isSupplier:
          type: boolean
          title: is_supplier
          description: Whether the Location supplies items.
        building:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.Building'
          title: building
          description: Owning Building.
        categories:
          type: array
          items:
            $ref: '#/components/schemas/supplier.v1.Category'
          title: categories
          description: Empty for ordinary Locations.
        floor:
          type:
            - string
            - "null"
          title: floor
          description: Optional floor.
        coordinates:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.Coordinates'
          title: coordinates
          description: WGS84 point.
        openFrom:
          allOf:
            - $ref: '#/components/schemas/google.type.TimeOfDay'
          title: open_from
          description: Asia/Singapore wall-clock opening time.
        openTo:
          allOf:
            - $ref: '#/components/schemas/google.type.TimeOfDay'
          title: open_to
          description: Asia/Singapore wall-clock closing time.
        contact:
          type:
            - string
            - "null"
          title: contact
          description: Optional contact information.
        details:
          type: string
          title: details
          description: Directions and remote-purchase information.
        archivedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: archived_at
          description: Set only when archived.
        currentDisablement:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.Disablement'
          title: current_disablement
          description: Currently active warning, if any. Location remains selectable.
        revision:
          type: string
          title: revision
          format: int64
          description: Optimistic concurrency revision.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
          description: Creation time in UTC.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
          description: Modification time in UTC.
      title: Location
      additionalProperties: false
      description: One campus Location. Archive excludes selection; disablement only warns.
    supplier.v1.LocationAdditionRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          description: Stable request identity.
        proposal:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.LocationProposal'
          title: proposal
          description: Mutable proposal fields.
        submittedBy:
          type: string
          title: submitted_by
          description: Redacted from generally visible approved responses.
        status:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.LocationAdditionRequestStatus'
          title: status
          description: Current review status.
        reviewedBy:
          type:
            - string
            - "null"
          title: reviewed_by
          description: Redacted from generally visible approved responses.
        reviewedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: reviewed_at
          description: Time of administrative review, if any.
        reviewNote:
          type:
            - string
            - "null"
          title: review_note
          description: Redacted from generally visible approved responses.
        resultingLocationId:
          type:
            - string
            - "null"
          title: resulting_location_id
          description: Created Location identity, only after approval.
        revision:
          type: string
          title: revision
          format: int64
          description: Optimistic concurrency revision.
        createdAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: created_at
          description: Creation time in UTC.
        updatedAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: updated_at
          description: Modification time in UTC.
      title: LocationAdditionRequest
      additionalProperties: false
      description: Caller-projected Location proposal and lifecycle metadata.
    supplier.v1.LocationAdditionRequestStatus:
      type: string
      title: LocationAdditionRequestStatus
      enum:
        - LOCATION_ADDITION_REQUEST_STATUS_UNSPECIFIED
        - LOCATION_ADDITION_REQUEST_STATUS_PENDING
        - LOCATION_ADDITION_REQUEST_STATUS_APPROVED
        - LOCATION_ADDITION_REQUEST_STATUS_REJECTED
        - LOCATION_ADDITION_REQUEST_STATUS_WITHDRAWN
      description: Terminal status is immutable.
    supplier.v1.LocationProposal:
      type: object
      properties:
        name:
          type: string
          title: name
          maxLength: 200
          description: Trimmed display name, required on submission.
        isSupplier:
          type:
            - boolean
            - "null"
          title: is_supplier
          description: Explicit Supplier classification, required on submission.
        categoryIds:
          type: array
          items:
            type: string
            format: uuid
          title: category_ids
          uniqueItems: true
          description: Suppliers require at least one existing Category. Ordinary Locations have none.
        buildingId:
          type: string
          title: building_id
          format: uuid
          description: Existing Building identity, required on submission.
        floor:
          type:
            - string
            - "null"
          title: floor
          maxLength: 50
          description: Optional trimmed floor. Empty or absent clears a masked field.
        coordinates:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.Coordinates'
          title: coordinates
          description: Required on submission and when coordinates are masked.
        openFrom:
          allOf:
            - $ref: '#/components/schemas/google.type.TimeOfDay'
          title: open_from
          description: Asia/Singapore local opening time. Set or clear with open_to.
        openTo:
          allOf:
            - $ref: '#/components/schemas/google.type.TimeOfDay'
          title: open_to
          description: Asia/Singapore local closing time. Earlier than open_from means overnight.
        contact:
          type:
            - string
            - "null"
          title: contact
          maxLength: 500
          description: Optional trimmed contact information.
        details:
          type: string
          title: details
          maxLength: 2000
          description: Optional directions or remote-purchase information. Empty clears the field.
      title: LocationProposal
      additionalProperties: false
      description: |
        Mutable proposal fields. Masked empty optional fields clear existing values.
        hours_precision // opening times must have valid hours and microsecond precision
    supplier.v1.PageInfo:
      type: object
      properties:
        page:
          type: integer
          title: page
          format: int32
          description: One-based current page.
        pageSize:
          type: integer
          title: page_size
          format: int32
          description: Effective size, default 20, maximum 100.
        totalItems:
          type: string
          title: total_items
          format: int64
          description: Total visible matching resources.
        totalPages:
          type: integer
          title: total_pages
          format: int32
          description: Total pages, zero for an empty result.
      title: PageInfo
      additionalProperties: false
      description: Counts include only resources visible to the caller after filtering.
    supplier.v1.RejectLocationAdditionRequestRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: Existing request identity.
        reviewNote:
          type: string
          title: review_note
          maxLength: 2000
          minLength: 1
          description: Required trimmed explanation, 1-2000 characters.
      title: RejectLocationAdditionRequestRequest
      additionalProperties: false
      description: Reject one caller-visible request.
    supplier.v1.RejectLocationAdditionRequestResponse:
      type: object
      properties:
        request:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.LocationAdditionRequest'
          title: request
          description: Full for submitters/admins; approved public views redact identities and notes.
      title: RejectLocationAdditionRequestResponse
      additionalProperties: false
      description: Resulting caller-projected request.
    supplier.v1.SubmitLocationAdditionRequestRequest:
      type: object
      properties:
        proposal:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.LocationProposal'
          title: proposal
          description: Complete proposal, including explicit classification and coordinates.
        idempotencyKey:
          type: string
          title: idempotency_key
          format: uuid
          description: UUID retry key scoped by caller and method for 24 hours.
      title: SubmitLocationAdditionRequestRequest
      required:
        - proposal
      additionalProperties: false
      description: |
        Submit a complete Location proposal. Suspended users are denied.
        complete_proposal // name, classification, Building and coordinates are required
    supplier.v1.SubmitLocationAdditionRequestResponse:
      type: object
      properties:
        request:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.LocationAdditionRequest'
          title: request
          description: Full for submitters/admins; approved public views redact identities and notes.
      title: SubmitLocationAdditionRequestResponse
      additionalProperties: false
      description: Resulting caller-projected request.
    supplier.v1.UpdateDisablementRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: Existing Disablement.
        startsAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: starts_at
          description: Required when starts_at is masked. Only scheduled intervals may be edited.
        endsAt:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.Timestamp'
          title: ends_at
          description: Absent and masked clears the natural end.
        reason:
          type: string
          title: reason
          maxLength: 500
          description: Trimmed reason when masked.
        updateMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: update_mask
          description: Non-empty paths from starts_at, ends_at, reason.
        expectedRevision:
          exclusiveMinimum: 0
          type: string
          title: expected_revision
          format: int64
          description: Revision observed before this update.
      title: UpdateDisablementRequest
      required:
        - updateMask
      additionalProperties: false
      description: Updates only a scheduled Disablement.
    supplier.v1.UpdateDisablementResponse:
      type: object
      properties:
        disablement:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.Disablement'
          title: disablement
          description: Current persisted interval and lifecycle state.
      title: UpdateDisablementResponse
      additionalProperties: false
      description: Resulting Disablement.
    supplier.v1.UpdateLocationAdditionRequestRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: Existing request identity.
        proposal:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.LocationProposal'
          title: proposal
          description: Patch values. Masked optional empty fields are cleared.
        updateMask:
          allOf:
            - $ref: '#/components/schemas/google.protobuf.FieldMask'
          title: update_mask
          description: Writable proposal paths. Opening and closing must be masked together.
        expectedRevision:
          exclusiveMinimum: 0
          type: string
          title: expected_revision
          format: int64
          description: Revision observed before this update.
      title: UpdateLocationAdditionRequestRequest
      required:
        - proposal
        - updateMask
      additionalProperties: false
      description: Updates a pending request without overwriting unmasked fields.
    supplier.v1.UpdateLocationAdditionRequestResponse:
      type: object
      properties:
        request:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.LocationAdditionRequest'
          title: request
          description: Full for submitters/admins; approved public views redact identities and notes.
      title: UpdateLocationAdditionRequestResponse
      additionalProperties: false
      description: Resulting caller-projected request.
    supplier.v1.WithdrawLocationAdditionRequestRequest:
      type: object
      properties:
        id:
          type: string
          title: id
          format: uuid
          description: Existing request identity.
      title: WithdrawLocationAdditionRequestRequest
      additionalProperties: false
      description: Withdraw one caller-visible request.
    supplier.v1.WithdrawLocationAdditionRequestResponse:
      type: object
      properties:
        request:
          allOf:
            - $ref: '#/components/schemas/supplier.v1.LocationAdditionRequest'
          title: request
          description: Full for submitters/admins; approved public views redact identities and notes.
      title: WithdrawLocationAdditionRequestResponse
      additionalProperties: false
      description: Resulting caller-projected request.
    user.v1.CheckRequest:
      type: object
      title: CheckRequest
      additionalProperties: false
    user.v1.CheckResponse:
      type: object
      properties:
        status:
          type: string
          title: status
      title: CheckResponse
      additionalProperties: false
security: []
