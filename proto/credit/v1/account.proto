syntax = "proto3";

package credit.v1;

import "buf/validate/validate.proto";
import "credit/v1/shared_types.proto";

// The caller's own credits. Read-only; the caller is identified by their User
// Service JWT.
service CreditAccountService {
  rpc GetMyAccount(GetMyAccountRequest) returns (GetMyAccountResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc ListMyLedgerEntries(ListMyLedgerEntriesRequest) returns (ListMyLedgerEntriesResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
}

message GetMyAccountRequest {}

message GetMyAccountResponse {
  Account account = 1;
}

// Newest first.
message ListMyLedgerEntriesRequest {
  // One-based; zero means 1.
  int32 page = 1 [(buf.validate.field).int32.gte = 0];
  // Zero means 20; maximum 100.
  int32 page_size = 2 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}

message ListMyLedgerEntriesResponse {
  repeated LedgerEntry entries = 1;
  PageInfo page_info = 2;
}
