syntax = "proto3";

package supplier.location.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";
import "supplier/location/v1/shared_types.proto";

// Terminal status is immutable.
enum LocationAdditionRequestStatus {
  // No status filter in list requests.
  LOCATION_ADDITION_REQUEST_STATUS_UNSPECIFIED = 0;
  LOCATION_ADDITION_REQUEST_STATUS_PENDING = 1;
  LOCATION_ADDITION_REQUEST_STATUS_APPROVED = 2;
  LOCATION_ADDITION_REQUEST_STATUS_REJECTED = 3;
  LOCATION_ADDITION_REQUEST_STATUS_WITHDRAWN = 4;
}

message LocationAdditionRequest {
  string id = 1;
  LocationInput proposal = 2;
  // Redacted from generally visible approved responses.
  string submitted_by = 3;
  LocationAdditionRequestStatus status = 4;
  // Redacted from generally visible approved responses.
  optional string reviewed_by = 5;
  google.protobuf.Timestamp reviewed_at = 6;
  // Redacted from generally visible approved responses.
  optional string review_note = 7;
  optional string resulting_location_id = 8;
  int64 revision = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}


// Owner maintenance and administrator review of Location proposals.
service LocationAdditionRequestService {
  rpc SubmitLocationAdditionRequest(SubmitLocationAdditionRequestRequest) returns (SubmitLocationAdditionRequestResponse) {}
  rpc ListLocationAdditionRequests(ListLocationAdditionRequestsRequest) returns (ListLocationAdditionRequestsResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc GetLocationAdditionRequest(GetLocationAdditionRequestRequest) returns (GetLocationAdditionRequestResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  rpc UpdateLocationAdditionRequest(UpdateLocationAdditionRequestRequest) returns (UpdateLocationAdditionRequestResponse) {}
  rpc WithdrawLocationAdditionRequest(WithdrawLocationAdditionRequestRequest) returns (WithdrawLocationAdditionRequestResponse) { option idempotency_level = IDEMPOTENT; }
  rpc ApproveLocationAdditionRequest(ApproveLocationAdditionRequestRequest) returns (ApproveLocationAdditionRequestResponse) { option idempotency_level = IDEMPOTENT; }
  rpc RejectLocationAdditionRequest(RejectLocationAdditionRequestRequest) returns (RejectLocationAdditionRequestResponse) { option idempotency_level = IDEMPOTENT; }
}
// Submit a complete Location proposal. Suspended users are denied.
message SubmitLocationAdditionRequestRequest {
  LocationInput proposal = 1 [(buf.validate.field).required = true];
  // UUID retry key scoped by caller and method for 24 hours.
  string idempotency_key = 2 [(buf.validate.field).string.uuid = true];
  option (buf.validate.message).cel = {
    id: "complete_proposal"
    message: "name, classification, Building and coordinates are required"
    expression: "this.proposal.name.size() > 0 && has(this.proposal.is_supplier) && this.proposal.building_id.size() > 0 && has(this.proposal.coordinates)"
  };
}
// Counts and filters apply after caller visibility.
message ListLocationAdditionRequestsRequest {
  LocationAdditionRequestStatus status = 1 [(buf.validate.field).enum.defined_only = true];
  // One-based; zero means 1.
  int32 page = 2 [(buf.validate.field).int32.gte = 0];
  // Zero means 20; maximum 100.
  int32 page_size = 3 [(buf.validate.field).int32 = {gte: 0, lte: 100}];
}
// Updates a pending request without overwriting unmasked fields.
message UpdateLocationAdditionRequestRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Validate selected fields and the merged proposal, not a complete patch input.
  LocationInput proposal = 2 [(buf.validate.field).ignore = IGNORE_ALWAYS];
  // Writable proposal paths. Opening and closing must be masked together.
  google.protobuf.FieldMask update_mask = 3 [
    (buf.validate.field).required = true,
    (buf.validate.field).field_mask.in = "name",
    (buf.validate.field).field_mask.in = "is_supplier",
    (buf.validate.field).field_mask.in = "category_ids",
    (buf.validate.field).field_mask.in = "building_id",
    (buf.validate.field).field_mask.in = "floor",
    (buf.validate.field).field_mask.in = "coordinates",
    (buf.validate.field).field_mask.in = "opens_at",
    (buf.validate.field).field_mask.in = "closes_at",
    (buf.validate.field).field_mask.in = "contact",
    (buf.validate.field).field_mask.in = "details"
  ];
  int64 expected_revision = 4 [(buf.validate.field).int64.gt = 0];
}
message GetLocationAdditionRequestRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message WithdrawLocationAdditionRequestRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message ApproveLocationAdditionRequestRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}
message RejectLocationAdditionRequestRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string review_note = 2 [(buf.validate.field).string = {min_len: 1, max_len: 2000}];
}
message SubmitLocationAdditionRequestResponse {
  LocationAdditionRequest request = 1;
}
message GetLocationAdditionRequestResponse {
  LocationAdditionRequest request = 1;
}
message UpdateLocationAdditionRequestResponse {
  LocationAdditionRequest request = 1;
}
message WithdrawLocationAdditionRequestResponse {
  LocationAdditionRequest request = 1;
}
message ApproveLocationAdditionRequestResponse {
  LocationAdditionRequest request = 1;
  // Location created atomically with approval, or the original on retry.
  Location location = 2;
}
message RejectLocationAdditionRequestResponse {
  LocationAdditionRequest request = 1;
}
// Visible requests ordered by creation descending then ID.
message ListLocationAdditionRequestsResponse {
  repeated LocationAdditionRequest requests = 1;
  PageInfo page_info = 2;
}
