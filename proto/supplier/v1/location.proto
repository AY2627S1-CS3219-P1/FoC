syntax = "proto3";

package supplier.v1;

import "buf/validate/validate.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/timestamp.proto";

// Requires authentication. Mutations are admin only.
service LocationService {
  // Also returns archived Locations, so old references still resolve.
  rpc GetLocation(GetLocationRequest) returns (GetLocationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListLocations(ListLocationsRequest) returns (ListLocationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListBuildings(ListBuildingsRequest) returns (ListBuildingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc ListCategories(ListCategoriesRequest) returns (ListCategoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }

  rpc CreateLocation(CreateLocationRequest) returns (CreateLocationResponse) {}

  rpc UpdateLocation(UpdateLocationRequest) returns (UpdateLocationResponse) {}

  // Soft delete; Locations are never physically deleted.
  rpc ArchiveLocation(ArchiveLocationRequest) returns (ArchiveLocationResponse) {
    option idempotency_level = IDEMPOTENT;
  }

  rpc UnarchiveLocation(UnarchiveLocationRequest) returns (UnarchiveLocationResponse) {
    option idempotency_level = IDEMPOTENT;
  }
}

// A Supplier is a Location with is_supplier set, not a separate resource.
message Location {
  string id = 1;
  // Not unique.
  string name = 2;
  bool is_supplier = 3;
  Building building = 4;
  // Empty for non-Supplier Locations.
  repeated Category categories = 5;
  optional string floor = 6;
  Coordinates coordinates = 7;
  // "HH:MM", 24-hour. Set together with closes_at, or neither is set.
  optional string opens_at = 8 [(buf.validate.field).string.pattern = "^([01][0-9]|2[0-3]):[0-5][0-9]$"];
  optional string closes_at = 9 [(buf.validate.field).string.pattern = "^([01][0-9]|2[0-3]):[0-5][0-9]$"];
  optional string contact = 10;
  // Directions and remote-purchase instructions.
  string details = 11;
  google.protobuf.Timestamp archived_at = 12;
  // In effect now, if any. Disabled Locations stay selectable.
  Disablement current_disablement = 13;
  // For optimistic concurrency.
  int64 revision = 14;
  google.protobuf.Timestamp created_at = 15;
  google.protobuf.Timestamp updated_at = 16;
}

// WGS 84 degrees.
message Coordinates {
  double latitude = 1 [(buf.validate.field).double = {
    gte: -90
    lte: 90
  }];
  double longitude = 2 [(buf.validate.field).double = {
    gte: -180
    lte: 180
  }];
}

// Seed-managed.
message Building {
  string id = 1;
  string name = 2;
  Coordinates center = 3;
  float radius_m = 4;
}

// Seed-managed, e.g. "Food" or "Printing".
message Category {
  string id = 1;
  string name = 2;
}

message Disablement {
  string id = 1;
  google.protobuf.Timestamp starts_at = 2;
  // Unset means until re-enabled.
  google.protobuf.Timestamp ends_at = 3;
  string reason = 4;
}

// Ties are broken by Location ID so pagination is stable.
enum LocationSortField {
  // Defaults to NAME.
  LOCATION_SORT_FIELD_UNSPECIFIED = 0;
  LOCATION_SORT_FIELD_NAME = 1;
  // Then by Location name.
  LOCATION_SORT_FIELD_BUILDING = 2;
}

enum SortDirection {
  // Defaults to ASCENDING.
  SORT_DIRECTION_UNSPECIFIED = 0;
  SORT_DIRECTION_ASCENDING = 1;
  SORT_DIRECTION_DESCENDING = 2;
}

enum LocationStatusView {
  // Defaults to ACTIVE.
  LOCATION_STATUS_VIEW_UNSPECIFIED = 0;
  LOCATION_STATUS_VIEW_ACTIVE = 1;
  // Admin only.
  LOCATION_STATUS_VIEW_ARCHIVED = 2;
  // Admin only.
  LOCATION_STATUS_VIEW_ALL = 3;
}

message GetLocationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetLocationResponse {
  Location location = 1;
}

message ListLocationsRequest {
  // Fuzzy, case-insensitive name match. Trimmed; empty matches all.
  string search = 1 [(buf.validate.field).string.max_len = 200];
  optional string building_id = 2 [(buf.validate.field).string.uuid = true];
  optional string category_id = 3 [(buf.validate.field).string.uuid = true];
  bool suppliers_only = 4;
  LocationStatusView status_view = 5 [(buf.validate.field).enum.defined_only = true];
  LocationSortField sort_field = 6 [(buf.validate.field).enum.defined_only = true];
  SortDirection sort_direction = 7 [(buf.validate.field).enum.defined_only = true];
  // One-based; 0 means 1.
  int32 page = 8 [(buf.validate.field).int32.gte = 0];
  // 0 means 20.
  int32 page_size = 9 [(buf.validate.field).int32 = {
    gte: 0
    lte: 100
  }];
}

message ListLocationsResponse {
  repeated Location locations = 1;
  int32 page = 2;
  int32 page_size = 3;
  // Matches visible to the caller.
  int64 total_items = 4;
  int32 total_pages = 5;
}

message ListBuildingsRequest {}

// Sorted by name.
message ListBuildingsResponse {
  repeated Building buildings = 1;
}

message ListCategoriesRequest {}

// Sorted by name.
message ListCategoriesResponse {
  repeated Category categories = 1;
}

// Writable Location fields. Strings are trimmed before length checks.
message LocationInput {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  // Suppliers need at least one Category; ordinary Locations have none.
  bool is_supplier = 2;
  repeated string category_ids = 3 [(buf.validate.field).repeated = {
    unique: true
    items: {
      string: {uuid: true}
    }
  }];
  string building_id = 4 [(buf.validate.field).string.uuid = true];
  optional string floor = 5 [(buf.validate.field).string.max_len = 50];
  Coordinates coordinates = 6 [(buf.validate.field).required = true];
  // Asia/Singapore "HH:MM". Set together with closes_at, or neither is set.
  // Must differ from closes_at; closing before opening means overnight.
  optional string opens_at = 7 [(buf.validate.field).string.pattern = "^([01][0-9]|2[0-3]):[0-5][0-9]$"];
  optional string closes_at = 8 [(buf.validate.field).string.pattern = "^([01][0-9]|2[0-3]):[0-5][0-9]$"];
  optional string contact = 9 [(buf.validate.field).string.max_len = 500];
  string details = 10 [(buf.validate.field).string.max_len = 2000];
}

message CreateLocationRequest {
  // Client-generated. Retrying with the same key and payload within 24 hours
  // returns the original Location; a different payload is already_exists.
  string idempotency_key = 1 [(buf.validate.field).string.uuid = true];
  LocationInput location = 2 [(buf.validate.field).required = true];
}

message CreateLocationResponse {
  Location location = 1;
}

message UpdateLocationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  // Must match the current revision, otherwise aborted.
  int64 expected_revision = 2 [(buf.validate.field).int64.gt = 0];
  LocationInput location = 3 [(buf.validate.field).required = true];
  // Paths into LocationInput to change, e.g. "name". A masked optional field
  // left unset is cleared. opens_at and closes_at must be masked together.
  google.protobuf.FieldMask update_mask = 4 [(buf.validate.field).required = true];
}

message UpdateLocationResponse {
  Location location = 1;
}

message ArchiveLocationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message ArchiveLocationResponse {
  Location location = 1;
}

message UnarchiveLocationRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message UnarchiveLocationResponse {
  Location location = 1;
}
