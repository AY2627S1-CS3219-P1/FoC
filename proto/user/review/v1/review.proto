syntax = "proto3";

package user.review.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";

service ReviewService {
  rpc SubmitReview(SubmitReviewRequest) returns (SubmitReviewResponse) {}
  rpc CreateReviewPhotoUpload(CreateReviewPhotoUploadRequest) returns (CreateReviewPhotoUploadResponse) {}
  rpc ListReviewsForUser(ListReviewsForUserRequest) returns (ListReviewsForUserResponse) {}
  rpc ListMyReviews(ListMyReviewsRequest) returns (ListMyReviewsResponse) {}
  rpc ListUnpublishedReviewsForUser(ListUnpublishedReviewsForUserRequest) returns (ListUnpublishedReviewsForUserResponse) {}
  rpc ListMyReviewsReceived(ListMyReviewsReceivedRequest) returns (ListMyReviewsReceivedResponse) {}
  rpc ListMyReviewsForOrders(ListMyReviewsForOrdersRequest) returns (ListMyReviewsForOrdersResponse) {}
  rpc GetMyReviewForOrder(GetMyReviewForOrderRequest) returns (GetMyReviewForOrderResponse) {}
  rpc RemoveReview(RemoveReviewRequest) returns (RemoveReviewResponse) {}
  rpc ListReviewRemovals(ListReviewRemovalsRequest) returns (ListReviewRemovalsResponse) {}
  rpc ListMyReviewRemovals(ListMyReviewRemovalsRequest) returns (ListMyReviewRemovalsResponse) {}
  rpc GetReview(GetReviewRequest) returns (GetReviewResponse) {}
}

message Review {
  string id = 1;
  string reviewer_id = 2;
  string reviewee_id = 3;
  string order_id = 4;
  int32 rating = 5;
  string comment = 6;
  google.protobuf.Timestamp created_at = 7;
  string reviewer_name = 8;
  string reviewee_name = 9;
  // Pre-signed GET URLs; responses carrying them are not cacheable.
  repeated ReviewPhoto photos = 10;
}

message ReviewPhoto {
  string id = 1;
  string url = 2;
  string content_type = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ReviewSubmission {
  int32 rating = 1 [(buf.validate.field).int32 = {
    gte: 1
    lte: 5
  }];
  string comment = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100000
  }];
}

message SubmitReviewRequest {
  // Must be the authenticated caller.
  string from = 1 [(buf.validate.field).string.uuid = true];
  string to = 2 [(buf.validate.field).string.uuid = true];
  string order_id = 3 [(buf.validate.field).string.uuid = true];
  ReviewSubmission submission = 4 [(buf.validate.field).required = true];
  // Ordered IDs returned by CreateReviewPhotoUpload.
  repeated string photo_ids = 5 [(buf.validate.field).repeated = {
    max_items: 5
    items: {
      string: {uuid: true}
    }
  }];
}

// Submission commits a pending review; success does not imply publication.
message SubmitReviewResponse {
  string review_id = 1;
  reserved 2;
  reserved "moderation_request_id";
  // Always PENDING_MODERATION for newly gated submissions.
  ModerationStatus moderation_status = 3;
}

message CreateReviewPhotoUploadRequest {
  string content_type = 1 [(buf.validate.field).string = {
    in: [
      "image/jpeg",
      "image/png",
      "image/webp",
      "image/heic",
      "image/heif"
    ]
  }];
  int64 size_bytes = 2 [(buf.validate.field).int64 = {
    gte: 1
    lte: 10000000
  }];
}

message CreateReviewPhotoUploadResponse {
  string photo_id = 1;
  string upload_url = 2;
  map<string, string> upload_headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}

message ListReviewsForUserResponse {
  repeated Review reviews = 1;
  pagination.v1.PageInfo pagination = 2;
}

message ListMyReviewsResponse {
  repeated Review reviews = 1;
  pagination.v1.PageInfo pagination = 2;
}

message ListReviewsForUserRequest {
  // A suspended caller may only request their own id.
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  pagination.v1.Pagination pagination = 2;
}

message ListMyReviewsRequest {
  pagination.v1.Pagination pagination = 1;
}

message ListMyReviewsReceivedRequest {
  pagination.v1.Pagination pagination = 1;
}

message ListMyReviewsReceivedResponse {
  repeated Review reviews = 1;
  pagination.v1.PageInfo pagination = 2;
}

message ListMyReviewsForOrdersRequest {
  repeated string order_ids = 1 [(buf.validate.field).repeated = {
    max_items: 50
    items: {
      string: {uuid: true}
    }
  }];
}

message ListMyReviewsForOrdersResponse {
  // Live reviews that can be fetched with GetMyReviewForOrder.
  repeated string reviewed_order_ids = 1;
  // Removed reviews still block resubmission; their content is not returned.
  repeated string removed_order_ids = 2;
}

// A removed review returns FailedPrecondition with reason REVIEW_REMOVED.
message GetMyReviewForOrderRequest {
  string order_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetMyReviewForOrderResponse {
  Review review = 1;
  ModerationStatus moderation_status = 2;
}

message RemoveReviewRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string reason = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 100000
  }];
}

message RemoveReviewResponse {}

message ReviewRemoval {
  string id = 1;
  string reviewer_id = 2;
  string reviewee_id = 3;
  string order_id = 4;
  string reason = 5;
  google.protobuf.Timestamp created_at = 6;
  string created_by = 7;
  string created_by_name = 8;
  // The removed review, which an appeal names as removed_review_id.
  string review_id = 9;
}

message ListReviewRemovalsRequest {
  pagination.v1.Pagination pagination = 1;
}

message ListReviewRemovalsResponse {
  repeated ReviewRemoval removals = 1;
  pagination.v1.PageInfo pagination = 2;
}

// Reviews the caller wrote that are currently removed outside a report, each
// with its latest unrestored removal. A removal applied by a report outcome is
// appealed through that report instead. Open to suspended users.
message ListMyReviewRemovalsRequest {
  pagination.v1.Pagination pagination = 1;
}

message ListMyReviewRemovalsResponse {
  repeated ReviewRemoval removals = 1;
  pagination.v1.PageInfo pagination = 2;
}

// One review, for moderation. Administrators may read any review, including a
// removed one; its reviewer and reviewee may read it while it is live. Anyone
// else gets NOT_FOUND. Responses carry pre-signed photo URLs and are not
// cacheable.
message GetReviewRequest {
  string review_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetReviewResponse {
  Review review = 1;
  // The review is currently removed; only administrators see removed reviews.
  bool removed = 2;
}

// Public reads and ratings include only APPROVED reviews.
enum ModerationStatus {
  MODERATION_STATUS_UNSPECIFIED = 0;
  MODERATION_STATUS_PENDING_MODERATION = 1;
  MODERATION_STATUS_APPROVED = 2;
  MODERATION_STATUS_REJECTED = 3;
  // Technical failure to assess, not a content verdict.
  MODERATION_STATUS_MODERATION_ERROR = 4;
}

// Lists reviews by author, unlike ListReviewsForUser which lists reviews received.
// Does not call CMS; remains available during moderation outages.
message ListUnpublishedReviewsForUserRequest {
  // Owner or admin only, checked before lookup. Suspended callers may inspect their own.
  string reviewer_id = 1 [(buf.validate.field).string.uuid = true];
  pagination.v1.Pagination pagination = 2;
  reserved 3, 4;
  reserved "moderation_status_filter", "order_id";
}

message ListUnpublishedReviewsForUserResponse {
  repeated UnpublishedReview reviews = 1;
  pagination.v1.PageInfo pagination = 2;
}

message UnpublishedReview {
  string id = 1;
  string reviewer_id = 2;
  string reviewee_id = 3;
  string order_id = 4;
  int32 rating = 5;
  string comment = 6;
  google.protobuf.Timestamp created_at = 7;
  string reviewer_name = 8;
  string reviewee_name = 9;
  ModerationStatus moderation_status = 10;
  // Correlates unpublished reviews with moderation job lookups.
  string moderation_request_id = 11;
  int32 content_revision = 12;
  // Known rejection reason codes when rejected; empty otherwise.
  repeated string moderation_reason_codes = 13;
  optional google.protobuf.Timestamp moderated_at = 14;
  // Generation of the last result applied by User, for distinguishing newer CMS retries.
  int32 applied_run_generation = 15;
}
