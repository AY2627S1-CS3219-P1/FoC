syntax = "proto3";

// Appeal contract for user-service (RP7-RP12). The affected user appeals one or
// more final decisions: a closed report's outcome, an account warning, a
// review removal, or a decision to keep a review they reported. Suspended users
// may appeal. Administrators review the appeal, may ask another affected
// participant to respond, and close it with an upheld or overturned outcome for
// every decision. Overturned outcomes are applied in the closing transaction.
//
// Lifecycle: OPEN -> UNDER_REVIEW <-> AWAITING_RESPONSE -> CLOSED. An
// administrator may close an appeal from any unclosed state.
package user.appeal.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";

service AppealService {
  // Participants.
  rpc SubmitAppeal(SubmitAppealRequest) returns (SubmitAppealResponse) {}
  rpc ListMyAppeals(ListMyAppealsRequest) returns (ListMyAppealsResponse) {}
  rpc GetAppeal(GetAppealRequest) returns (GetAppealResponse) {}
  rpc SubmitResponse(SubmitResponseRequest) returns (SubmitResponseResponse) {}

  // Administrators.
  rpc ListAppeals(ListAppealsRequest) returns (ListAppealsResponse) {}
  rpc BeginReview(BeginReviewRequest) returns (BeginReviewResponse) {}
  rpc RequestResponse(RequestResponseRequest) returns (RequestResponseResponse) {}
  rpc CloseAppeal(CloseAppealRequest) returns (CloseAppealResponse) {}
}

enum AppealStatus {
  APPEAL_STATUS_UNSPECIFIED = 0;
  APPEAL_STATUS_OPEN = 1;
  APPEAL_STATUS_UNDER_REVIEW = 2;
  APPEAL_STATUS_AWAITING_RESPONSE = 3;
  APPEAL_STATUS_CLOSED = 4;
}

enum DecisionOutcome {
  DECISION_OUTCOME_UNSPECIFIED = 0;
  // The decision stands; nothing changes (RP12.5).
  DECISION_OUTCOME_UPHELD = 1;
  // The decision is reversed and its consequence undone (RP12.1-RP12.4).
  DECISION_OUTCOME_OVERTURNED = 2;
}

// A decision to appeal. The target names both the decision and its kind.
message AppealedDecision {
  oneof target {
    option (buf.validate.oneof).required = true;
    // The outcome of a closed report about the caller. The reporter may appeal
    // a no-action outcome on an order report; for a review report they appeal
    // the retained review instead.
    string report_id = 1 [(buf.validate.field).string.uuid = true];
    // An active warning on the caller's account that no report produced.
    string warning_id = 2 [(buf.validate.field).string.uuid = true];
    // A review the caller wrote that an administrator removed outside a report.
    string removed_review_id = 3 [(buf.validate.field).string.uuid = true];
    // A live review about the caller that a closed report of theirs kept.
    string retained_review_id = 4 [(buf.validate.field).string.uuid = true];
    // Reserved until Credit records administrative adjustments; rejected as
    // unimplemented.
    string credit_entry_id = 5 [(buf.validate.field).string.uuid = true];
  }
}

// A challenged decision as stored, with its outcome once the appeal closes.
message Decision {
  string id = 1;
  oneof target {
    string report_id = 2;
    string warning_id = 3;
    string removed_review_id = 4;
    string retained_review_id = 5;
    string credit_entry_id = 6;
  }
  // The other participant affected by the decision, if any. They may read the
  // appeal and may be asked to respond.
  string counterpart_id = 7;
  string counterpart_name = 8;
  // Set once the appeal is closed.
  DecisionOutcome outcome = 9;
  string outcome_reason = 10;
}

// The appellant and every counterpart may read an appeal.
message Appeal {
  string id = 1;
  string appellant_id = 2;
  string appellant_name = 3;
  // The originating order, when the decisions have one.
  optional string request_id = 4;
  string reason = 5;
  AppealStatus status = 6;
  // The participant asked to respond while AWAITING_RESPONSE.
  string awaited_user_id = 7;
  repeated Decision decisions = 8;
  google.protobuf.Timestamp closed_at = 9;
  string closed_by = 10;
  string closer_name = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
}

// A reply from a participant an administrator asked to respond.
message AppealResponse {
  string id = 1;
  string appeal_id = 2;
  string responder_id = 3;
  string responder_name = 4;
  string body = 5;
  google.protobuf.Timestamp created_at = 6;
}

// Resubmitting the same idempotency key and payload returns the original
// appeal (RP7.7); the same key with a different payload is ALREADY_EXISTS.
message SubmitAppealRequest {
  string idempotency_key = 1 [(buf.validate.field).string.uuid = true];
  // The originating order. Optional: when omitted it is derived from the
  // decisions if they share one.
  optional string request_id = 2 [(buf.validate.field).string.uuid = true];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4000
  }];
  repeated AppealedDecision decisions = 4 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
}

message SubmitAppealResponse {
  Appeal appeal = 1;
}

// Appeals the caller filed or is a counterpart of. Open to suspended users.
message ListMyAppealsRequest {
  pagination.v1.Pagination pagination = 1;
}

message ListMyAppealsResponse {
  repeated Appeal appeals = 1;
  pagination.v1.PageInfo pagination = 2;
}

message GetAppealRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetAppealResponse {
  Appeal appeal = 1;
  // Oldest first.
  repeated AppealResponse responses = 2;
}

// Only the participant asked to respond may reply, while the appeal is
// AWAITING_RESPONSE. The reply moves it back to UNDER_REVIEW.
message SubmitResponseRequest {
  string appeal_id = 1 [(buf.validate.field).string.uuid = true];
  string body = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4000
  }];
}

message SubmitResponseResponse {
  Appeal appeal = 1;
  AppealResponse response = 2;
}

// Every filter is optional and combined with AND.
message ListAppealsRequest {
  optional AppealStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string appellant_id = 2 [(buf.validate.field).string.uuid = true];
  pagination.v1.Pagination pagination = 3;
}

message ListAppealsResponse {
  repeated Appeal appeals = 1;
  pagination.v1.PageInfo pagination = 2;
}

// Moves OPEN to UNDER_REVIEW. An administrator cannot act on an appeal they
// filed or one they are a counterpart of.
message BeginReviewRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message BeginReviewResponse {
  Appeal appeal = 1;
}

// Moves UNDER_REVIEW to AWAITING_RESPONSE and asks a counterpart to respond
// (RP9.1, RP9.2). Participants are not notified yet.
message RequestResponseRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  string participant_id = 2 [(buf.validate.field).string.uuid = true];
}

message RequestResponseResponse {
  Appeal appeal = 1;
}

message DecisionResolution {
  string decision_id = 1 [(buf.validate.field).string.uuid = true];
  DecisionOutcome outcome = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2000
  }];
}

// Closes an unclosed appeal with exactly one resolution per decision (RP11)
// and applies every overturned outcome in the same transaction (RP12).
message CloseAppealRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  repeated DecisionResolution resolutions = 2 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 10
  }];
}

message CloseAppealResponse {
  Appeal appeal = 1;
}
