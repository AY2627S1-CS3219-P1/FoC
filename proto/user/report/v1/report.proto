syntax = "proto3";

// User report contract for user-service (RP1-RP5). A user reports another user
// about exactly one review or one order. Administrators review the report,
// may request a response from the reported participant, and close it with a
// reasoned outcome. Warning, suspension and review-removal outcomes are applied
// in the same transaction as the close.
//
// Lifecycle: OPEN -> UNDER_REVIEW <-> AWAITING_RESPONSE -> CLOSED. An
// administrator may close a report from any unclosed state.
package user.report.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";

service ReportService {
  // Participants.
  rpc SubmitReport(SubmitReportRequest) returns (SubmitReportResponse) {}
  rpc ListMyReports(ListMyReportsRequest) returns (ListMyReportsResponse) {}
  rpc GetReport(GetReportRequest) returns (GetReportResponse) {}
  rpc SubmitResponse(SubmitResponseRequest) returns (SubmitResponseResponse) {}

  // Administrators.
  rpc ListReports(ListReportsRequest) returns (ListReportsResponse) {}
  rpc BeginReview(BeginReviewRequest) returns (BeginReviewResponse) {}
  rpc RequestResponse(RequestResponseRequest) returns (RequestResponseResponse) {}
  rpc CloseReport(CloseReportRequest) returns (CloseReportResponse) {}
}

enum ReportCategory {
  REPORT_CATEGORY_UNSPECIFIED = 0;
  REPORT_CATEGORY_HARASSMENT = 1;
  REPORT_CATEGORY_FRAUD = 2;
  REPORT_CATEGORY_NO_SHOW = 3;
  REPORT_CATEGORY_INAPPROPRIATE_CONTENT = 4;
  REPORT_CATEGORY_OTHER = 5;
}

enum ReportStatus {
  REPORT_STATUS_UNSPECIFIED = 0;
  REPORT_STATUS_OPEN = 1;
  REPORT_STATUS_UNDER_REVIEW = 2;
  REPORT_STATUS_AWAITING_RESPONSE = 3;
  REPORT_STATUS_CLOSED = 4;
}

// The consequence recorded when a report is closed (RP5). Administrative credit
// adjustment (RP5.5) is not available yet.
enum ReportOutcome {
  REPORT_OUTCOME_UNSPECIFIED = 0;
  REPORT_OUTCOME_NO_ACTION = 1;
  // Records an account warning against the reported participant.
  REPORT_OUTCOME_WARNING = 2;
  // Suspends the reported participant's account.
  REPORT_OUTCOME_SUSPENSION = 3;
  // Removes the reported review. Only valid for a review target.
  REPORT_OUTCOME_REVIEW_REMOVAL = 4;
}

// An order and the other participant the reporter is reporting. Order
// participation is not verified across services yet.
message OrderTarget {
  // Opaque order id owned by the order service; no foreign key here.
  string order_id = 1 [(buf.validate.field).string.uuid = true];
  string subject_id = 2 [(buf.validate.field).string.uuid = true];
}

// Both the reporter and the reported participant may read a report.
message Report {
  string id = 1;
  string reporter_id = 2;
  // The reported user. For a review target, the review's author.
  string subject_id = 3;
  oneof target {
    string review_id = 4;
    string order_id = 5;
  }
  ReportCategory category = 6;
  string description = 7;
  ReportStatus status = 8;
  // Set once the report is closed.
  ReportOutcome outcome = 9;
  string outcome_reason = 10;
  google.protobuf.Timestamp closed_at = 11;
  string closed_by = 12;
  google.protobuf.Timestamp created_at = 13;
  google.protobuf.Timestamp updated_at = 14;
  // display_name values joined at read time. closer_name is empty until closed.
  string reporter_name = 15;
  string subject_name = 16;
  string closer_name = 17;
}

// A reply from the reported participant.
message ReportResponse {
  string id = 1;
  string report_id = 2;
  string responder_id = 3;
  string responder_name = 4;
  string body = 5;
  google.protobuf.Timestamp created_at = 6;
}

message SubmitReportRequest {
  oneof target {
    option (buf.validate.oneof).required = true;
    // A live review the caller did not write; its author is the subject.
    string review_id = 1 [(buf.validate.field).string.uuid = true];
    OrderTarget order = 2;
  }
  ReportCategory category = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string description = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4000
  }];
}

message SubmitReportResponse {
  Report report = 1;
}

// Reports the caller filed or is the subject of. Open to suspended users.
message ListMyReportsRequest {
  pagination.v1.Pagination pagination = 1;
}

message ListMyReportsResponse {
  repeated Report reports = 1;
  pagination.v1.PageInfo pagination = 2;
}

// Administrators may read any report; other callers only reports they filed or
// are the subject of.
message GetReportRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message GetReportResponse {
  Report report = 1;
  // Oldest first.
  repeated ReportResponse responses = 2;
}

// Only the reported participant may respond, until the report is closed.
// Responding to a requested response moves AWAITING_RESPONSE to UNDER_REVIEW.
message SubmitResponseRequest {
  string report_id = 1 [(buf.validate.field).string.uuid = true];
  string body = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4000
  }];
}

message SubmitResponseResponse {
  Report report = 1;
  ReportResponse response = 2;
}

// Every filter is optional and combined with AND.
message ListReportsRequest {
  optional ReportStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional string subject_id = 2 [(buf.validate.field).string.uuid = true];
  optional string review_id = 3 [(buf.validate.field).string.uuid = true];
  optional string order_id = 4 [(buf.validate.field).string.uuid = true];
  pagination.v1.Pagination pagination = 5;
}

message ListReportsResponse {
  repeated Report reports = 1;
  pagination.v1.PageInfo pagination = 2;
}

// Moves OPEN to UNDER_REVIEW. An administrator cannot act on a report they
// filed or one about themselves.
message BeginReviewRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message BeginReviewResponse {
  Report report = 1;
}

// Moves UNDER_REVIEW to AWAITING_RESPONSE, asking the reported participant to
// respond. Participants are not notified yet.
message RequestResponseRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
}

message RequestResponseResponse {
  Report report = 1;
}

// Closes an unclosed report and applies its outcome in the same transaction.
// The reason is shown to both participants and recorded on any warning or
// suspension the outcome creates.
message CloseReportRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  ReportOutcome outcome = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string reason = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 2000
  }];
}

message CloseReportResponse {
  Report report = 1;
}
