syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "pagination/v1/pagination.proto";

service WarningService {
  rpc ListMyWarnings(ListMyWarningsRequest) returns (ListMyWarningsResponse) {}
  rpc ListWarningsForUser(ListWarningsForUserRequest) returns (ListWarningsForUserResponse) {}
  rpc MarkWarningAsRemoved(MarkWarningAsRemovedRequest) returns (MarkWarningAsRemovedResponse) {}
}

enum WarningStatus {
  WARNING_STATUS_UNSPECIFIED = 0;
  WARNING_STATUS_ACTIVE = 1;
  WARNING_STATUS_REMOVED = 2;
}

message AccountWarning {
  string id = 1;
  string request_id = 2;
  string reason = 3;
  WarningStatus status = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp removed_at = 6;
  optional string removed_reason = 7;
}

message ListMyWarningsRequest {
  pagination.v1.Pagination pagination = 1;
}

message ListMyWarningsResponse {
  repeated AccountWarning warnings = 1;
  pagination.v1.PageInfo pagination = 2;
}

message ListWarningsForUserRequest {
  string user_id = 1 [(buf.validate.field).string.uuid = true];
  pagination.v1.Pagination pagination = 2;
}

message ListWarningsForUserResponse {
  repeated AccountWarning warnings = 1;
  pagination.v1.PageInfo pagination = 2;
}

message MarkWarningAsRemovedRequest {
  string id = 1 [(buf.validate.field).string.uuid = true];
  optional string removed_reason = 2 [(buf.validate.field).string.max_len = 2000];
  optional string appeal_id = 3 [(buf.validate.field).string.uuid = true];
}

message MarkWarningAsRemovedResponse {}
