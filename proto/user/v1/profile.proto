syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "user/v1/auth.proto";

service ProfileService {
  rpc GetMyProfile(GetMyProfileRequest) returns (GetMyProfileResponse) {}
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse) {}
}

message Profile {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string description = 4;
  reserved 5;
  reserved "telegram_handle";
  // Absent only for accounts created before it was required.
  optional string phone_number = 6;
  UserRole role = 7;
}

message GetMyProfileRequest {}

message GetMyProfileResponse {
  Profile profile = 1;
}

// Every editable field is replaced.
message UpdateMyProfileRequest {
  // The service trims the name and requires 1 to 100 characters afterward.
  string display_name = 1;
  string description = 2 [(buf.validate.field).string.max_len = 500];
  reserved 3;
  reserved "telegram_handle";
  // Required. The service trims it and requires 1 to 20 characters afterward.
  string phone_number = 4;
}

message UpdateMyProfileResponse {
  Profile profile = 1;
}
