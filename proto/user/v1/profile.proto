syntax = "proto3";

package user.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "user/v1/auth.proto";

service ProfileService {
  rpc GetMyProfile(GetMyProfileRequest) returns (GetMyProfileResponse) {}
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (UpdateMyProfileResponse) {}

  // Deletion status for the authenticated account's pending deletion job.
  // Reports only the caller's own state; no arbitrary-target lookup.
  rpc GetMyAccountDeletionStatus(GetMyAccountDeletionStatusRequest) returns (GetMyAccountDeletionStatusResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
}

message Profile {
  string id = 1;
  string email = 2;
  string display_name = 3;
  string description = 4;
  reserved 5;
  reserved "telegram_handle";
  // E.164. Absent only for the bootstrapped admin until they add one.
  optional string phone_number = 6;
  UserRole role = 7;
  // True once the account's irreversible deletion has been accepted.
  bool is_deleting = 8;
}

message GetMyProfileRequest {}

message GetMyProfileResponse {
  Profile profile = 1;
}

// Every editable field is replaced.
message UpdateMyProfileRequest {
  // The service trims the name and requires 1 to 100 characters afterward.
  string display_name = 1;
  string description = 2 [(buf.validate.field).string.max_len = 500];
  reserved 3;
  reserved "telegram_handle";
  // Required. Validated and stored like RegisterRequest.phone_number.
  string phone_number = 4;
}

message UpdateMyProfileResponse {
  Profile profile = 1;
}

message GetMyAccountDeletionStatusRequest {}

message GetMyAccountDeletionStatusResponse {
  bool is_deleting = 1;
  // The original, immutable deletion request time.
  google.protobuf.Timestamp requested_at = 2;
  // When the deletion worker last completed an outstanding-work check.
  google.protobuf.Timestamp last_checked_at = 3;
  // Stable reason codes explaining why finalization is still waiting, e.g.
  // "order_outstanding", "offer_open", "credit_reservation". Empty means the
  // worker is not currently reporting a blocker. An unavailable dependency is
  // reported as "check_unavailable"; it never means "no outstanding work".
  repeated string waiting_reasons = 4;
}
