syntax = "proto3";

package moderation.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// Admin configuration of the content moderation service's LLM evaluation:
// model selection, supported inference parameters and output mode, versioned
// as immutable configuration versions with an active pointer.
//
// Configuration never contains or returns API credentials. Setup status
// reports only whether a server-side credential is configured. Admin gates
// apply to every RPC in this service.
service ModerationAdminService {
  // Reports whether an active configuration exists, whether a server-side
  // provider credential is configured and the provider endpoint fingerprint.
  rpc GetModerationSetupStatus(GetModerationSetupStatusRequest) returns (GetModerationSetupStatusResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // Chat-capable model IDs discovered through the provider's authenticated
  // model listing. Model IDs carry no capability guarantees.
  rpc ListAvailableModels(ListAvailableModelsRequest) returns (ListAvailableModelsResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // The active configuration version, or none when the service still awaits
  // its first activation.
  rpc GetActiveModerationConfiguration(GetActiveModerationConfigurationRequest) returns (GetActiveModerationConfigurationResponse) { option idempotency_level = NO_SIDE_EFFECTS; }
  // Persists a validated draft configuration version. Failed validation
  // leaves the active configuration unchanged.
  rpc SaveModerationConfigurationDraft(SaveModerationConfigurationDraftRequest) returns (SaveModerationConfigurationDraftResponse) {}
  // Runs one bounded test inference with the draft through the same local
  // concurrency gate as workers, returning a sample assessment.
  rpc TestModerationConfigurationDraft(TestModerationConfigurationDraftRequest) returns (TestModerationConfigurationDraftResponse) {}
  // Activates a draft. Optimistic concurrency on the currently active
  // version: activation applies only when expected_active_version_id matches.
  rpc ActivateModerationConfiguration(ActivateModerationConfigurationRequest) returns (ActivateModerationConfigurationResponse) {}
}

message GetModerationSetupStatusRequest {}

message GetModerationSetupStatusResponse {
  // True when an active configuration version exists.
  bool has_active_configuration = 1;
  // True when a server-side provider credential is configured. Never the
  // credential itself.
  bool has_provider_credential = 2;
  // Stored provider endpoint fingerprint of the active configuration.
  string provider_fingerprint = 3;
  // Code-owned policy/schema version currently compiled into the service.
  string policy_version = 4;
  string default_system_message = 5;
}

message ListAvailableModelsRequest {}

message ListAvailableModelsResponse {
  repeated ModerationModel models = 1;
}

message ModerationModel {
  // Provider model identifier, e.g. "ornith-1.5".
  string model_id = 1;
  // Provider-reported owner, when present.
  string owned_by = 2;
}

message GetActiveModerationConfigurationRequest {}

message GetActiveModerationConfigurationResponse {
  ModerationConfiguration configuration = 1;
}

message ModerationConfiguration {
  string version_id = 1;
  string model_id = 2;
  ModerationInferenceParameters parameters = 3;
  ModerationOutputMode output_mode = 4;
  string policy_version = 5;
  string provider_fingerprint = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  string activated_by = 9;
  google.protobuf.Timestamp activated_at = 10;
  string system_message = 11;
}

message ModerationInferenceParameters {
  optional double temperature = 1;
  optional double top_p = 2;
  optional double presence_penalty = 3;
  optional double frequency_penalty = 4;
  // Mutually exclusive token budget spellings.
  optional int64 max_completion_tokens = 5;
  optional int64 max_tokens = 6;
  repeated string stop = 7;
  optional int64 seed = 8;
  // Bounded advanced provider-parameters object, validated against the
  // service-owned allowlist. Application-owned request fields (messages,
  // roles, model, schema/response_format, streaming, n, tools, headers,
  // endpoint, credentials) can never be overridden through it.
  map<string, string> advanced_parameters = 9;
  // Provider reasoning-effort selection where supported.
  optional string reasoning_effort = 10;
}

message SaveModerationConfigurationDraftRequest {
  string model_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 200
  }];
  ModerationInferenceParameters parameters = 2;
  ModerationOutputMode output_mode = 3 [(buf.validate.field).enum = {
    not_in: [0]
    defined_only: true
  }];
  // Empty uses the service default. Stored immutably with this version.
  string system_message = 4 [(buf.validate.field).string.max_len = 16384];
}

message SaveModerationConfigurationDraftResponse {
  string draft_version_id = 1;
}

message TestModerationConfigurationDraftRequest {
  string draft_version_id = 1 [(buf.validate.field).string.uuid = true];
  // A short benign sample comment used as assessment input.
  string sample_comment = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 10000
  }];
}

message TestModerationConfigurationDraftResponse {
  // Decision the draft configuration produced for the sample comment.
  string decision = 1;
  repeated string reason_codes = 2;
  string model_id = 3;
  string output_mode = 4;
  int64 duration_ms = 5;
  // Sanitized error class when the test could not produce a verdict.
  string error_class = 6;
}

message ActivateModerationConfigurationRequest {
  string draft_version_id = 1 [(buf.validate.field).string.uuid = true];
  // Optimistic concurrency: empty means no active version is expected (first
  // activation or deliberate replacement after re-reading state).
  string expected_active_version_id = 2;
  // Explicitly start a new generation for configuration-paused jobs using this version.
  bool resume_paused_jobs = 3;
}

message ActivateModerationConfigurationResponse {
  ModerationConfiguration configuration = 1;
}

enum ModerationOutputMode {
  MODERATION_OUTPUT_MODE_UNSPECIFIED = 0;
  // Strict structured output via response_format json_schema.
  MODERATION_OUTPUT_MODE_JSON_SCHEMA = 1;
  // JSON mode via response_format json_object; local schema validation still
  // applies.
  MODERATION_OUTPUT_MODE_JSON_OBJECT = 2;
}
