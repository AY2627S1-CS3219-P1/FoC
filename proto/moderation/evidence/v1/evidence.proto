syntax = "proto3";

// Image evidence shared by reports and appeals (RP1.6, RP2.2, RP8.2, RP9.4).
// Each service exposes its own upload and download RPCs; these messages carry
// the images. Uploads follow review photos: request a grant, PUT the image to
// upload_url with upload_headers, then pass the evidence ID when submitting.
package moderation.evidence.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// The image to upload. Allowed types and size match review photos.
message EvidenceUpload {
  string content_type = 1 [(buf.validate.field).string = {
    in: [
      "image/jpeg",
      "image/png",
      "image/webp",
      "image/heic",
      "image/heif"
    ]
  }];
  int64 size_bytes = 2 [(buf.validate.field).int64 = {
    gte: 1
    lte: 10000000
  }];
}

// A signed direct upload. Images not attached within a day are deleted.
message EvidenceUploadGrant {
  string evidence_id = 1;
  string upload_url = 2;
  map<string, string> upload_headers = 3;
  google.protobuf.Timestamp expires_at = 4;
}

// An attached image. The URL is short-lived; request a fresh one through the
// owning service's GetEvidenceDownload after expires_at.
message Evidence {
  string id = 1;
  string url = 2;
  string content_type = 3;
  google.protobuf.Timestamp expires_at = 4;
}
