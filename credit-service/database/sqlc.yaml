version: "2"
sql:
  - name: "credit"
    engine: "postgresql"
    queries: "query"
    schema: "schema"
    gen:
      go:
        package: "creditdb"
        out: "../internal/database/creditdb"
        sql_package: "pgx/v5"
        omit_unused_structs: true
        # Plain Go types instead of pgtype wrappers.
        emit_pointers_for_null_types: true
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
