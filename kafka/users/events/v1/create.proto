syntax = "proto3";

package users.events.v1;

import "google/protobuf/timestamp.proto";

// UserCreated announces a committed new user on users.create.
message UserCreated {
  // Stable across delivery retries; consumers use this to deduplicate.
  string event_id = 1;
  string user_id = 2;
  string email = 3;
  string display_name = 4;
  google.protobuf.Timestamp created_at = 5;
}
