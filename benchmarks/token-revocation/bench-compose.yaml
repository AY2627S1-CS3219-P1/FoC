# Standalone Redis-vs-Postgres access-token revocation benchmark.
#
# This file is NOT referenced by the repository's docker compose (compose.yaml)
# and lives entirely inside benchmarks/token-revocation/, which is not in
# go.work and not in the repo lint list. Delete the whole directory to remove it.

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: bench
      POSTGRES_USER: bench
      POSTGRES_PASSWORD: bench
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bench -d bench"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    # Durability settings for the durable-writes benchmark: fsync on every
    # write and synchronous commit, so an acknowledged write is really durable.
    # max_connections=600 gives the pg/http pool sweep headroom on a fresh
    # volume (a stock container starts at 100); see LANDMINES/redis-bench-pg-max-connections.md.
    command:
      - "postgres"
      - "-c"
      - "fsync=on"
      - "-c"
      - "synchronous_commit=on"
      - "-c"
      - "max_connections=600"
    # Fixed limits make runs reproducible; they are the numbers to cite.
    cpus: "2.0"
    mem_limit: 1g

  redis:
    image: redis:8-alpine
    # Durable writes: append-only file, fsync on every acknowledged append, so a
    # SET … EX is durable at the ack. See LANDMINES for the host-instance caveat.
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    cpus: "1.0"
    mem_limit: 512m

  benchmark:
    build:
      context: .
      dockerfile: Dockerfile.bench
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Results are written to the host ./results directory.
    volumes:
      - ./results:/out
    environment:
      REDIS_ADDR: "redis:6379"
      PG_DSN: "postgres://bench:bench@postgres:5432/bench?sslmode=disable"
      ISSUER_PORT: "8089"
    # The issuer (Variant C) runs in-process on loopback inside this container,
    # so the load generator reaches it without touching host networking.
    command:
      - "--variant"
      - "all"
      - "--levels"
      - "100,1000,10000"
      - "--sessions"
      - "1000000"
      - "--duration"
      - "15s"
      - "--warmup"
      - "3s"
      - "--reps"
      - "2"
      - "--pg-pool"
      - "100"
      - "--out"
      - "/out"
    cpus: "8.0"
    mem_limit: 8g
