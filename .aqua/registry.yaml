# yaml-language-server: $schema=https://raw.githubusercontent.com/aquaproj/aqua/main/json-schema/registry.json
packages:
  - name: istio/istio
    type: github_release
    repo_owner: istio
    repo_name: istio
    asset: istio-{{.Version}}-{{.OS}}-{{.Arch}}.tar.gz
    format: tar.gz
    replacements:
      darwin: osx
    files:
      - name: istioctl
        src: istio-{{.Version}}/bin/istioctl
    checksum:
      type: github_release
      asset: "{{.Asset}}.sha256"
      algorithm: sha256
    supported_envs:
      - linux
      - darwin
      - amd64
      - arm64
