version: "2"
sql:
  - name: "report"
    engine: "postgresql"
    queries: "query/reports.sql"
    schema: "schema"
    gen:
      go:
        package: "reportdb"
        out: "../internal/database/reportdb"
        sql_package: "database/sql"
        omit_unused_structs: true
        emit_empty_slices: true
